<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moved</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #fff;
      color: #222;
    }

    .container {
      text-align: center;
    }

    .loader {
      width: 42px;
      height: 42px;
      margin: 0 auto 20px;
      border: 4px solid #ddd;
      border-top-color: #333;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .message {
      font-size: 18px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="loader"></div>
    <div class="message">This has been moved to another site.</div>
  </div>

  <script>
    setTimeout(() => {
      window.location.href = "https://dani-is.living-the.life/";
    }, 1500);
  </script>
</body>
</html>
